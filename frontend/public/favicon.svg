<?xml version="1.0" encoding="UTF-8"?>
<!--
  Cosecre mark — a bold C whose opening is a document slot, with a sheet coming
  through it. Same silhouette as cosecre-print's icon (they are sibling apps),
  in Cosecre's palette.

  Keep in sync with src/components/BrandMark.vue and ../../build/icon.svg.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="0.3" y2="1">
      <stop offset="0" stop-color="#ffffff" />
      <stop offset="1" stop-color="#f7e9d4" />
    </linearGradient>
    <linearGradient id="arc" x1="0" y1="0" x2="0.4" y2="1">
      <stop offset="0" stop-color="#f68d68" />
      <stop offset="1" stop-color="#b83c14" />
    </linearGradient>
  </defs>

  <rect x="16" y="16" width="480" height="480" rx="112" fill="url(#tile)" />
  <rect x="16" y="16" width="480" height="480" rx="112" fill="none"
        stroke="rgba(28,25,23,0.10)" stroke-width="2" />

  <!-- The C: a 260-degree arc opening to the right. Butt caps, so the gap
       reads as a slot rather than an unfinished circle. -->
  <path d="M 329.7 350.9 A 132 132 0 1 1 329.7 161.1"
        transform="translate(-8 0)"
        fill="none" stroke="url(#arc)" stroke-width="58" />

  <!-- The sheet passes through the gap without crossing the arc, which is what
       lets it carry an outline for free. Without one it dissolves at 16px. -->
  <rect x="210" y="214" width="232" height="84" rx="19"
        fill="#ffffff" stroke="#3a5a3c" stroke-width="13" />
  <g fill="#3a5a3c" opacity="0.55">
    <rect x="248" y="238" width="152" height="13" rx="6.5" />
    <rect x="248" y="262" width="100" height="13" rx="6.5" />
  </g>
</svg>
