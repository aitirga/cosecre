<?xml version="1.0" encoding="UTF-8"?>
<!--
  Cosecre — application icon master ("Ledger").

  The Cosecre C standing on a data table: a solid header row and two lighter
  body rows, split into two columns. It says what the product does rather than
  what it is — documents in, rows out — and the C stays the thing you recognise.

  This is the single source of truth for the app icon. Edit here, then run
  `npm run icons` to regenerate desktop/build/icon.png, which electron-builder
  turns into the .icns and .ico at package time.

  Keep the 512-unit coordinate system, and keep in sync with:
    frontend/public/favicon.svg           (the web favicon)
    frontend/src/components/BrandMark.vue (the in-app mark)

  The alternative that was considered — the C on a writing desk — is kept in
  concepts/ as a record of the choice.

  Rules that keep it legible at 16px:
    • Nothing thinner than 24 units. macOS downsamples 1024 to 16, so a
      24-unit gap is about 0.75px; the 14 that looked right at full size
      closed up entirely and the table read as plain stripes.
    • The rows step down in weight rather than in size. At 16px the block is
      four pixels tall, and a top-to-bottom gradient of weight is the only
      thing that still reads as "header, then data".
    • Butt caps on the arc, not round. The flat ends are what make the gap in
      the C read as deliberate rather than as an unfinished circle.
    • The columns are unequal. Two equal ones read as a split rectangle, not
      as a table.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="1024" height="1024">
  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="0.3" y2="1">
      <stop offset="0" stop-color="#ffffff" />
      <stop offset="1" stop-color="#f7e9d4" />
    </linearGradient>
    <linearGradient id="arc" x1="0" y1="0" x2="0.4" y2="1">
      <stop offset="0" stop-color="#f68d68" />
      <stop offset="1" stop-color="#b83c14" />
    </linearGradient>
  </defs>

  <rect x="16" y="16" width="480" height="480" rx="112" fill="url(#tile)" />
  <rect x="16" y="16" width="480" height="480" rx="112" fill="none"
        stroke="rgba(28,25,23,0.10)" stroke-width="2" />

  <!-- The C: a 260-degree arc, opening to the right. -->
  <path d="M 311.3 263.9 A 86 86 0 1 1 311.3 132.1"
        fill="none" stroke="url(#arc)" stroke-width="54" />

  <!-- The table it stands on. -->
  <g fill="#3a5a3c">
    <rect x="96" y="326" width="182" height="30" rx="8" />
    <rect x="302" y="326" width="114" height="30" rx="8" />
  </g>
  <g fill="#3a5a3c" opacity="0.42">
    <rect x="96" y="364" width="182" height="26" rx="7" />
    <rect x="302" y="364" width="114" height="26" rx="7" />
  </g>
  <g fill="#3a5a3c" opacity="0.24">
    <rect x="96" y="398" width="182" height="26" rx="7" />
    <rect x="302" y="398" width="114" height="26" rx="7" />
  </g>
</svg>
