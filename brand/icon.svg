<?xml version="1.0" encoding="UTF-8"?>
<!--
  Cosecre — application icon master ("Aperture").

  A bold C whose opening is the paper slot, with a sheet coming through it.
  Designed for Cosecre-print; since the print tool moved into Cosecre it is
  the whole app's icon.

  This is the single source of truth for the app icon. Edit here, then run
  `npm run icons` to regenerate desktop/build/icon.png, which electron-builder
  turns into the .icns and .ico at package time.

  Keep the 512-unit coordinate system, and keep in sync with:
    frontend/public/favicon.svg           (the web favicon)
    frontend/src/components/BrandMark.vue (the in-app mark)

  The previous mark — the C standing on a data table ("Ledger") — and the
  concepts that preceded it are kept in concepts/ as a record.

  Rules that keep it legible at 16px:
    • No hairlines. Every stroke is at least 13 units, so nothing disappears
      when macOS downsamples 1024 px to 16 px.
    • The sheet is outlined, not plain white. On a pale tile an unoutlined
      sheet dissolves into the background by 16 px; the outline is free,
      because the sheet passes through the gap without crossing the arc.
    • The sheet clears the arc's ends (y 123-185 and y 327-389), so the C
      never looks broken.
    • Butt caps on the arc: the flat ends make the gap read as a paper slot
      instead of an incomplete circle.
    • Text lines are left-aligned and unequal; centred equal-length lines read
      as an "=" sign.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="1024" height="1024">
  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="0.3" y2="1">
      <stop offset="0" stop-color="#ffffff" />
      <stop offset="1" stop-color="#d7e7fa" />
    </linearGradient>
    <linearGradient id="paper" x1="0" y1="0" x2="0.35" y2="1">
      <stop offset="0" stop-color="#ffffff" />
      <stop offset="1" stop-color="#f2f7fe" />
    </linearGradient>
    <linearGradient id="blue" x1="0" y1="0" x2="0.4" y2="1">
      <stop offset="0" stop-color="#7ea8ee" />
      <stop offset="1" stop-color="#2f5aa8" />
    </linearGradient>
  </defs>

  <rect x="16" y="16" width="480" height="480" rx="112" fill="url(#tile)" />
  <rect x="16" y="16" width="480" height="480" rx="112" fill="none"
        stroke="rgba(47,90,168,0.13)" stroke-width="2" />

  <!-- The C: a 260-degree arc, opening to the right. Butt caps, not round —
       the flat ends are what make the gap read as a paper slot. -->
  <path d="M 329.7 350.9 A 132 132 0 1 1 329.7 161.1"
        transform="translate(-8 0)"
        fill="none" stroke="url(#blue)" stroke-width="58" />

  <!-- The sheet passes through the aperture. Its vertical extent is chosen to
       clear both stroke ends (y 123-185 and y 327-389) even once the 13-unit
       outline is counted, so the C stays whole. -->
  <rect x="210" y="214" width="232" height="84" rx="19"
        fill="url(#paper)" stroke="#2f5aa8" stroke-width="13" />
  <!-- Two lines, left-aligned and of unequal length. Centred equal-length lines
       read as an "=" sign rather than as text on a page. -->
  <g fill="#2f5aa8" opacity="0.5">
    <rect x="248" y="238" width="152" height="13" rx="6.5" />
    <rect x="248" y="262" width="100" height="13" rx="6.5" />
  </g>
</svg>
