<?xml version="1.0" encoding="UTF-8"?>
<!--
  Concept B — "Ledger".

  The Cosecre C set on a data table — a solid header row and two lighter body
  rows, split into two columns. Says what the product actually does: documents
  in, rows out.

  512-unit grid. The column gap is 24 units (≈0.75px at 16) rather than the 14
  that looked right at full size — anything finer closes up and the table reads
  as plain stripes.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bTile" x1="0" y1="0" x2="0.3" y2="1">
      <stop offset="0" stop-color="#ffffff" />
      <stop offset="1" stop-color="#f7e9d4" />
    </linearGradient>
    <linearGradient id="bArc" x1="0" y1="0" x2="0.4" y2="1">
      <stop offset="0" stop-color="#f68d68" />
      <stop offset="1" stop-color="#b83c14" />
    </linearGradient>
  </defs>

  <rect x="16" y="16" width="480" height="480" rx="112" fill="url(#bTile)" />
  <rect x="16" y="16" width="480" height="480" rx="112" fill="none"
        stroke="rgba(28,25,23,0.10)" stroke-width="2" />

  <!-- The C: same 260° arc as concept A, a little smaller to leave the table
       room to be three rows rather than a stripe. -->
  <path d="M 311.3 263.9 A 86 86 0 1 1 311.3 132.1"
        fill="none" stroke="url(#bArc)" stroke-width="54" />

  <!-- The table. The header carries full weight and the body rows step down in
       opacity, so at 16px the block still reads top-down as a table. -->
  <g fill="#3a5a3c">
    <rect x="96" y="326" width="182" height="30" rx="8" />
    <rect x="302" y="326" width="114" height="30" rx="8" />
  </g>
  <g fill="#3a5a3c" opacity="0.42">
    <rect x="96" y="364" width="182" height="26" rx="7" />
    <rect x="302" y="364" width="114" height="26" rx="7" />
  </g>
  <g fill="#3a5a3c" opacity="0.24">
    <rect x="96" y="398" width="182" height="26" rx="7" />
    <rect x="302" y="398" width="114" height="26" rx="7" />
  </g>
</svg>
