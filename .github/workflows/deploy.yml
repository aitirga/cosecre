name: Deploy

# Every push to main is tested and, if green, deployed to Fly — the same thing
# `just deploy` does by hand. The app keeps exactly one machine with a volume,
# so deploys never overlap: a newer push waits for the running one to finish.
on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-fly
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: hub/uv.lock

      - name: Hub tests
        working-directory: hub
        run: uv run --locked pytest -q

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Typecheck
        run: npm run typecheck

  deploy:
    needs: check
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v5

      - uses: superfly/flyctl-actions/setup-flyctl@master

      # Same flags as `just deploy`: one machine, replaced in place.
      - name: Deploy to Fly
        run: flyctl deploy --remote-only --ha=false --strategy immediate -a cosecre-aitirga
        env:
          # A deploy-scoped token for this app only:
          #   fly tokens create deploy -a cosecre-aitirga | gh secret set FLY_API_TOKEN
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
