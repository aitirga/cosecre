app = "cosecre-aitirga"
primary_region = "fra"

[build]
  dockerfile = "Dockerfile"

[env]
  COSECRE_DATABASE_URL = "sqlite:////data/cosecre.db"
  COSECRE_UPLOAD_DIR = "/data/uploads"
  COSECRE_STATIC_DIR = "/app/web"
  COSECRE_ALLOW_OPEN_REGISTRATION = "false"
  COSECRE_IDLE_TIMEOUT_SECONDS = "600"
  # 10 reads at once: ~215 MiB used / ~570 MiB free measured mid-migration, and
  # each in-flight photo adds roughly 20–30 MiB. Check `just memory` if raised.
  COSECRE_EXTRACTION_CONCURRENCY = "10"
  # Folders in the owner's Drive, shared with the service account as Editor.
  COSECRE_GOOGLE_DRIVE_DOCUMENTS_FOLDER_ID = "1Sbx6n0u-0oMqMprlsFymdUXsz8or8yDB"
  COSECRE_GOOGLE_DRIVE_BACKUP_FOLDER_ID = "1RO2dlqxfdPz5__S_asNwRryJqV2rcLFb"

[mounts]
  source = "cosecre_data"
  destination = "/data"
  initial_size = "3gb"
  scheduled_snapshots = true
  snapshot_retention = 14

[http_service]
  internal_port = 8000
  force_https = true
  # The app stops itself only after requests AND background jobs finish.
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 0

  [[http_service.checks]]
    grace_period = "30s"
    interval = "30s"
    timeout = "5s"
    method = "GET"
    path = "/healthz"

[[vm]]
  cpu_kind = "shared"
  cpus = 1
  memory = "1gb"

[[restart]]
  policy = "on-failure"
  retries = 10
